<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>井盖年龄榜 · 审核后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin:0; background:#f5f6f8; color:#222; }
  /* 登录遮罩 */
  #login { position:fixed; inset:0; background:#f5f6f8; display:flex; align-items:center; justify-content:center; z-index:100; }
  #login .box { background:#fff; border-radius:12px; padding:28px 32px; width:300px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
  #login h2 { margin:0 0 18px; font-size:18px; color:#1989fa; }
  #login input { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; margin-bottom:14px; }
  #login button { width:100%; background:#1989fa; color:#fff; border:none; border-radius:8px; padding:11px; font-size:15px; cursor:pointer; }
  #login .err { color:#ee0a24; font-size:13px; min-height:18px; margin-bottom:8px; }
  #app { display:none; }
  header { background:#1989fa; color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:18px; margin:0; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
  .tab { padding:8px 16px; border:1px solid #ccc; border-radius:20px; background:#fff; cursor:pointer; }
  .tab.active { background:#1989fa; color:#fff; border-color:#1989fa; }
  .panel { display:none; }
  .panel.active { display:block; }
  .card { background:#fff; border:1px solid #eee; border-radius:10px; padding:12px; margin-bottom:12px; display:flex; gap:12px; }
  .card img { width:96px; height:96px; object-fit:cover; border-radius:8px; flex-shrink:0; background:#eee; }
  .meta { flex:1; font-size:13px; line-height:1.6; word-break:break-all; }
  .meta b { color:#1989fa; }
  .actions { display:flex; flex-direction:column; gap:6px; justify-content:center; }
  button { border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
  .approve { background:#07c160; color:#fff; }
  .hide { background:#fa8c16; color:#fff; }
  .reject { background:#ee0a24; color:#fff; }
  .delete { background:#fff; color:#ee0a24; border:1px solid #ee0a24; }
  .refresh { background:#fff; border:1px solid #1989fa; color:#1989fa; margin-left:auto; }
  .logout { background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .empty { text-align:center; color:#999; padding:40px; }
  .badge { display:inline-block; border-radius:4px; padding:1px 8px; font-size:12px; margin-left:6px; vertical-align:middle; }
  .badge.pending { background:#fff7e6; color:#d48806; }
  .badge.approved { background:#e6f7e6; color:#07c160; }
  .badge.rejected { background:#f5f5f5; color:#888; }
  .badge.deleted { background:#ffeaea; color:#ee0a24; }
  .card.deleted { opacity:.72; border-left:4px solid #ee0a24; }
  .tag { display:inline-block; background:#fff7e6; color:#d48806; border-radius:4px; padding:1px 6px; font-size:12px; }
  .link { color:#1989fa; cursor:pointer; text-decoration:underline; }
  .link:hover { color:#0a6ed1; }
  .cf-banner { background:#e8f3ff; border:1px solid #b3d8ff; border-radius:8px; padding:10px 12px; margin-bottom:12px; display:flex; align-items:center; gap:10px; font-size:13px; }
  .cf-banner b { color:#1989fa; }
  .cf-banner > span:first-child { flex:1; }
  .cf-acts { display:flex; gap:6px; flex-wrap:wrap; }
  .cf-act { border:none; border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer; color:#fff; }
  .cf-act.hide { background:#fa8c16; }
  .cf-act.reject { background:#ee0a24; }
  .cf-act.black { background:#333; }
  .cf-act.clear { background:#fff; color:#1989fa; border:1px solid #1989fa; }
  .manhole-table { margin-bottom:12px; border:1px solid #eee; border-radius:10px; overflow:hidden; background:#fff; }
  .manhole-table .mh-head { padding:8px 12px; font-size:13px; color:#666; background:#fafafa; border-bottom:1px solid #eee; }
  table.mh { width:100%; border-collapse:collapse; font-size:13px; }
  table.mh th, table.mh td { padding:8px 12px; text-align:left; border-bottom:1px solid #f2f2f2; }
  table.mh th { color:#888; font-weight:normal; background:#fafafa; }
  table.mh tbody tr { cursor:pointer; }
  table.mh tbody tr:hover { background:#e8f3ff; }
  table.mh td.mh-id { color:#1989fa; font-weight:600; }
  table.mh .mh-cur { background:#fff7e6; }
  .mh-empty { padding:14px 12px; color:#999; font-size:13px; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h2>审核后台登录</h2>
    <div class="err" id="err"></div>
    <input id="pw" type="password" placeholder="请输入管理口令" autofocus>
    <button id="go">登录</button>
  </div>
</div>

<div id="app">
  <header><h1>井盖年龄榜 · 审核后台</h1><button class="logout" id="logout">退出登录</button></header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-t="manholes">井盖内容</div>
      <div class="tab" data-t="comments">留言内容</div>
      <div class="tab" data-t="reports">用户举报</div>
      <div class="tab" data-t="blacklist">黑名单</div>
      <button class="refresh" id="refresh">刷新</button>
    </div>
    <div class="panel active" id="panel-manholes"></div>
    <div class="panel" id="panel-comments">
      <div id="manhole-table" class="manhole-table"></div>
      <div id="cf-banner" class="cf-banner" style="display:none"></div>
      <div id="cf-list"></div>
    </div>
    <div class="panel" id="panel-reports"></div>
    <div class="panel" id="panel-blacklist"></div>
  </div>
</div>

<script>
// ====== Supabase 客户端（仅用于调用 Edge Function，密钥为可公开的 anon/publishable key）======
const SUPABASE_URL = 'https://etxxigwpnhjjbebybdoz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_T1_-nzc4lAerAdUEY00ReA_LS38yxV-';
const FN = 'admin-api';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ====== 鉴权与 API 封装 ======
function getToken() { return localStorage.getItem('admin_token') || ''; }
function setToken(t) { localStorage.setItem('admin_token', t); }
function clearToken() { localStorage.removeItem('admin_token'); }

async function api(action, payload) {
  const headers = {};
  const t = getToken();
  if (t) headers['x-admin-token'] = t;
  const { data, error } = await sb.functions.invoke(FN, { body: { action, ...(payload || {}) }, headers });
  if (error) {
    // 401：未登录/过期 -> 回到登录页
    if (error.status === 401 || (error.message && error.message.includes('登录'))) {
      forceLogin();
      throw new Error('登录已过期，请重新登录');
    }
    let msg = error.message || '调用失败';
    try { const j = JSON.parse(error.message); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  return data;
}

function showApp() { document.getElementById('login').style.display = 'none'; document.getElementById('app').style.display = 'block'; }
function showLogin() { document.getElementById('app').style.display = 'none'; document.getElementById('login').style.display = 'flex'; clearToken(); }
function forceLogin() { showLogin(); document.getElementById('err').textContent = '登录已过期，请重新登录'; }

// ====== 登录逻辑 ======
async function doLogin() {
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  const pw = document.getElementById('pw').value;
  try {
    const { data, error } = await sb.functions.invoke(FN, { body: { action: 'login', password: pw } });
    if (error) {
      let msg = '登录失败';
      try { const j = JSON.parse(error.message); if (j && j.error) msg = j.error; } catch (e) { if (error.message) msg = error.message; }
      errEl.textContent = msg;
      return;
    }
    if (data && data.ok) {
      setToken(data.token);
      document.getElementById('pw').value = '';
      showApp();
      load('manholes');
    } else {
      errEl.textContent = (data && data.error) || '登录失败';
    }
  } catch (e) {
    errEl.textContent = e.message || '登录失败';
  }
}
document.getElementById('go').onclick = doLogin;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logout').onclick = () => { clearToken(); showLogin(); };

// ====== 以下为审核界面逻辑（与静态前端一致，仅数据来源改为 api()）======
const STATUS_TEXT = { pending:'待审核', approved:'已公开', rejected:'已隐藏', deleted:'已删除' };
let cur = 'manholes';
let commentFilter = null;
let commentRows = [];

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    cur = t.dataset.t;
    document.getElementById('panel-' + cur).classList.add('active');
    commentFilter = null;
    renderCommentBanner();
    load(cur);
  };
});
document.getElementById('refresh').onclick = () => load(cur);

async function load(type) {
  const panel = document.getElementById('panel-' + type);
  const listEl = (type === 'comments') ? document.getElementById('cf-list') : panel;
  listEl.innerHTML = '<div class="empty">加载中…</div>';
  try {
    let rows = [];
    if (type === 'blacklist') rows = (await api('blacklistList')).rows || [];
    else if (type === 'reports') rows = (await api('reports')).rows || [];
    else if (type === 'comments' && commentFilter) {
      const r = await api('commentsFilter', { filter: commentFilter.type, value: commentFilter.value });
      rows = r.rows || [];
    } else {
      const r = await api('list', { table: type });
      rows = r.rows || [];
    }
    if (!rows.length) { listEl.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    if (type === 'comments') commentRows = rows;
    listEl.innerHTML = rows.map(r => card(type, r)).join('');
    listEl.querySelectorAll('button[data-act]').forEach(b => { b.onclick = onAction; });
    listEl.querySelectorAll('.link').forEach(el => { el.onclick = onLink; });
    if (type === 'blacklist') {
      listEl.querySelectorAll('[data-del]').forEach(b => { b.onclick = () => removeBlacklist(b.dataset.del); });
    }
    if (type === 'comments') loadManholeTable();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
  }
}

async function onAction() {
  const { table, id, act } = this.dataset;
  try {
    if (act === 'delete') {
      if (!confirm('确认软删除该内容？内容将不再公开展示，但仍可在审核页「召回」恢复。')) return;
      const j = await api('softDelete', { table, id });
      if (j && j.deleted != null) load(cur); else alert('删除失败');
    } else if (act === 'purge') {
      if (!confirm('确认彻底删除？该内容及其图片将被永久移除，不可恢复。')) return;
      const j = await api('purge', { table, id });
      if (j && j.deleted != null) load(cur); else alert('彻底删除失败');
    } else if (act === 'recall') {
      const j = await api('setStatus', { table, id, status: 'approved' });
      if (j && j.updated != null) load(cur); else alert('召回失败');
    } else {
      const status = act === 'approve' ? 'approved' : 'rejected';
      const j = await api('setStatus', { table, id, status });
      if (j && j.updated != null) load(cur); else alert('操作失败');
    }
  } catch (e) { alert('请求出错: ' + e.message); }
}

function onLink() {
  const filter = this.dataset.filter;
  const value = this.dataset.value;
  if (!filter || value == null || value === '') return;
  commentFilter = { type: filter, value: value };
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  const tab = document.querySelector('.tab[data-t="comments"]');
  if (tab) tab.classList.add('active');
  document.getElementById('panel-comments').classList.add('active');
  cur = 'comments';
  renderCommentBanner();
  load('comments');
}

function renderCommentBanner() {
  const b = document.getElementById('cf-banner');
  if (!commentFilter) { b.style.display = 'none'; b.innerHTML = ''; return; }
  let html, btns;
  if (commentFilter.type === 'user') {
    html = '正在查看 <b>用户：' + esc(commentFilter.value) + '</b> 的全部留言';
    btns =
      '<button class="cf-act hide" data-bulk="hide">隐藏该用户全部留言</button>' +
      '<button class="cf-act reject" data-bulk="delete">删除全部留言</button>' +
      '<button class="cf-act black" data-bulk="blacklist">添加黑名单</button>' +
      '<button class="cf-act clear" id="cf-clear">返回全部</button>';
  } else {
    html = '正在查看 <b>井盖编号：#' + esc(commentFilter.value) + '</b> 的全部留言';
    btns =
      '<button class="cf-act hide" data-bulk="hide">全部隐藏</button>' +
      '<button class="cf-act reject" data-bulk="delete">全部删除</button>' +
      '<button class="cf-act clear" id="cf-clear">返回全部</button>';
  }
  b.style.display = 'flex';
  b.innerHTML = '<span>' + html + '</span><span class="cf-acts">' + btns + '</span>';
  b.querySelectorAll('[data-bulk]').forEach(el => { el.onclick = onBulk; });
  document.getElementById('cf-clear').onclick = () => { commentFilter = null; renderCommentBanner(); load('comments'); };
}

function drillManhole(id) {
  commentFilter = { type: 'manhole', value: String(id) };
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  const tab = document.querySelector('.tab[data-t="comments"]');
  if (tab) tab.classList.add('active');
  document.getElementById('panel-comments').classList.add('active');
  cur = 'comments';
  renderCommentBanner();
  load('comments');
}
async function loadManholeTable() {
  const el = document.getElementById('manhole-table');
  if (!el) return;
  try {
    const rows = (await api('commentsByManhole')).rows || [];
    if (!rows.length) {
      el.innerHTML = '<div class="mh-head">井盖留言索引</div><div class="mh-empty">暂无有留言的井盖</div>';
      return;
    }
    const curId = (commentFilter && commentFilter.type === 'manhole') ? String(commentFilter.value) : null;
    const body = rows.map(r => {
      const id = String(r.manhole_id);
      const cls = (id === curId) ? ' class="mh-cur"' : '';
      return `<tr data-mh="${esc(id)}"${cls}>` +
        `<td class="mh-id">#${esc(id)}</td>` +
        `<td>${r.comment_count}</td>` +
        `<td>${esc(r.last_comment_at)}</td></tr>`;
    }).join('');
    el.innerHTML = '<div class="mh-head">井盖留言索引（点击编号查看该井盖全部留言，按最近留言排序）</div>' +
      '<table class="mh"><thead><tr><th>井盖编号</th><th>留言数</th><th>最近留言</th></tr></thead><tbody>' +
      body + '</tbody></table>';
    el.querySelectorAll('tbody tr').forEach(tr => { tr.onclick = () => drillManhole(tr.dataset.mh); });
  } catch (e) {
    el.innerHTML = '<div class="mh-head">井盖留言索引</div><div class="mh-empty">加载失败: ' + e.message + '</div>';
  }
}

async function onBulk() {
  const act = this.dataset.bulk;
  try {
    if (act === 'hide' || act === 'delete') {
      const label = act === 'hide' ? '隐藏' : '删除';
      if (!confirm('确认' + label + '当前筛选范围内的全部留言？')) return;
      const body = { action: act };
      if (commentFilter.type === 'user') {
        const ids = distinctDeviceIds();
        if (!ids.length) return alert('未找到该用户的设备标识');
        body.deviceIds = ids;
      } else {
        body.manholeId = commentFilter.value;
      }
      const j = await api('bulkComments', body);
      if (j && j.updated != null) { alert('已' + label + ' ' + j.updated + ' 条留言'); load('comments'); }
      else alert('操作失败');
    } else if (act === 'blacklist') {
      const ids = distinctDeviceIds();
      if (!ids.length) return alert('未找到该用户的设备标识');
      if (!confirm('将以下设备ID加入黑名单？被拉黑后该用户访问界面将始终为「受限个人页」，无法浏览/发布，除非被移除黑名单：\n' + ids.join('\n'))) return;
      const j = await api('blacklistAdd', { deviceIds: ids, note: '用户名: ' + commentFilter.value });
      if (j) { alert('已加入黑名单 ' + (j.inserted || 0) + ' 个设备；该用户全部留言已自动隐藏（共 ' + (j.hidden || 0) + ' 条）'); load('comments'); }
      else alert('操作失败');
    }
  } catch (e) { alert('请求出错：' + e.message); }
}

function distinctDeviceIds() {
  const set = new Set();
  commentRows.forEach(r => { if (r.uploader_device_id) set.add(r.uploader_device_id); });
  return [...set];
}

async function removeBlacklist(deviceId) {
  if (!confirm('确认将该设备移出黑名单？移除后用户即可恢复正常访问。')) return;
  try {
    const j = await api('blacklistRemove', { deviceId });
    if (j) { alert('已移除黑名单；该设备用户的留言已恢复公开（共 ' + (j.restored || 0) + ' 条）'); load('blacklist'); }
    else alert('移除失败');
  } catch (e) { alert('请求出错：' + e.message); }
}

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function badge(status) {
  const t = STATUS_TEXT[status] || status || '—';
  const cls = ['pending','approved','rejected','deleted'].includes(status) ? status : '';
  return `<span class="badge ${cls}">${esc(t)}</span>`;
}
function card(type, r) {
  if (type === 'blacklist') {
    return `<div class="card"><div class="meta">
      <div><b>设备ID：</b>${esc(r.device_id)}</div>
      <div>加入时间：${esc(r.added_at) || '—'} ｜ 备注：${esc(r.note) || '—'} ｜ 操作人：${esc(r.added_by) || '—'}</div>
    </div><div class="actions">
      <button class="delete" data-del="${esc(r.device_id)}">移除黑名单</button>
    </div></div>`;
  }
  if (type === 'manholes') {
    const img = r.image_url
      ? `<img src="${esc(r.image_url)}" onerror="this.style.display='none'">`
      : '<div style="width:96px;height:96px;background:#eee;border-radius:8px;flex-shrink:0"></div>';
    const actions = actionButtons('manholes', r.id, r.status);
    return `<div class="card${r.status==='deleted'?' deleted':''}">${img}<div class="meta">
      <div><b>${esc(r.province) || '—'}</b> ${esc(r.city) || ''} ${esc(r.district) || ''} ${badge(r.status)}</div>
      <div>安装年份：${esc(r.install_year) || '—'} ｜ 材质：${esc(r.material) || '—'}</div>
      <div>设备：${esc(r.uploader_device_id) || '—'} ｜ 提交：${esc(r.created_at)}</div>
    </div><div class="actions">${actions}</div></div>`;
  }
  if (type === 'comments') {
    const actions = actionButtons('comments', r.id, r.status);
    const nameHtml = (r.display_name != null && r.display_name !== '')
      ? `<span class="link" data-filter="user" data-value="${esc(r.display_name)}">${esc(r.display_name)}</span>`
      : '—';
    const manholeHtml = (r.manhole_id != null)
      ? `<span class="link" data-filter="manhole" data-value="${esc(r.manhole_id)}">${esc(r.manhole_id)}</span>`
      : '—';
    return `<div class="card${r.status==='deleted'?' deleted':''}"><div class="meta">
      <div>${esc(r.content)} ${badge(r.status)}</div>
      <div>用户：${nameHtml} ｜ 关联井盖：${manholeHtml}</div>
      <div>设备：${esc(r.uploader_device_id) || '—'} ｜ 提交：${esc(r.created_at)}</div>
    </div><div class="actions">${actions}</div></div>`;
  }
  return `<div class="card${r.status==='deleted'?' deleted':''}"><div class="meta">
    <div><span class="tag">${esc(r.target_type)}</span> 目标ID：${esc(r.target_id)} ${badge(r.status)}</div>
    <div>原因：${esc(r.reason) || '—'}</div>
    <div>举报人：${esc(r.reporter_device_id) || '—'} ｜ 时间：${esc(r.created_at)}</div>
  </div><div class="actions">
    <button class="delete" data-act="delete" data-table="reports" data-id="${esc(r.id)}">删除</button>
  </div></div>`;
}
function actionButtons(table, id, status) {
  let btns = '';
  if (status === 'deleted') {
    btns += `<button class="approve" data-act="recall" data-table="${table}" data-id="${esc(id)}">召回</button>`;
    btns += `<button class="delete" data-act="purge" data-table="${table}" data-id="${esc(id)}">彻底删除</button>`;
  } else if (status === 'approved') {
    btns += `<button class="hide" data-act="hide" data-table="${table}" data-id="${esc(id)}">隐藏</button>`;
  } else {
    btns += `<button class="approve" data-act="approve" data-table="${table}" data-id="${esc(id)}">公开</button>`;
  }
  if (status !== 'deleted') {
    btns += `<button class="delete" data-act="delete" data-table="${table}" data-id="${esc(id)}">删除</button>`;
  }
  return btns;
}

// 启动：有令牌则直接进入，否则显示登录
if (getToken()) { showApp(); load('manholes'); }
else { showLogin(); }
